<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Capítulo I · Creta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app-puerta1" class="app-container">
        
        <!-- FOTOGRAFÍA DE FONDO -->
        <div id="bg-media" class="landing-media blur-background transition-blur" aria-hidden="true">
            <img id="bg-image" class="landing-image transition-image" src="assets/photos/creta_playa.jpg" alt="">
        </div>
        
        <div id="bg-darkness" class="landing-base-dark transition-opacity" aria-hidden="true" style="background-color: rgba(0, 0, 0, 0.45);"></div>

        <div class="ambient-lights" aria-hidden="true">
            <div class="light-blob light-1"></div>
            <div class="light-blob light-2"></div>
        </div>

        <!-- =================================================
             FASE 1: EL ACERTIJO
        ================================================== -->
        <section id="lock-screen" class="door-section">
            <div id="riddle-content" class="door-content animate-fade-in-up delay-1">
                <p class="door-number">Capítulo I</p>
                <h2 class="door-title">Bajo el sol del Egeo.</h2>
                <p class="door-question">
                    ¿Qué animal nos hizo caca en el mandala y, literalmente, estaba por todas partes vigilándonos?
                </p>
                <div class="input-group">
                    <input type="text" id="riddle-input" class="apple-input" placeholder="Escribe el animal..." autocomplete="off">
                    <p id="error-message" class="error-text hidden">Me temo que ese no es el animal...</p>
                </div>
            </div>

            <footer id="riddle-footer" class="door-footer animate-fade-in-up delay-2">
                <button id="btn-unlock" class="continue-button" type="button">
                    <span class="continue-label">Desbloquear</span>
                </button>
            </footer>

            <div id="success-message" class="success-message hidden">
                <h3 class="success-title">¡CORRECTO!</h3>
                <p class="success-subtitle">Recuerdo desbloqueado</p>
            </div>
        </section>

        <!-- =================================================
             FASE 2: LA PELÍCULA INMERSIVA
        ================================================== -->
        <section id="unlocked-screen" class="memory-screen hidden">
            
            <div class="dynamic-media-container">
                <div id="media-layer-1" class="media-layer layer-active"></div>
                <div id="media-layer-2" class="media-layer layer-hidden"></div>
                <div class="media-overlay"></div>
            </div>

            <div class="memory-content">
                <div class="memory-header">
                    <p class="door-number" style="color: rgba(255,255,255,0.8);">Verano 2026</p>
                    <h2 class="door-title" style="margin-bottom: 0.5rem; font-size: 3.5rem;">Creta.</h2>
                </div>

                <div class="memory-text-container" style="margin-top: auto; margin-bottom: 2rem; text-align: center;">
                    <p id="dynamic-story-text" class="door-question text-transition" style="font-size: 1.15rem; line-height: 1.6; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
                        Cargando recuerdo...
                    </p>
                </div>

                <footer class="door-footer" style="padding-bottom: 2rem;">
                    <!-- ¡BOTÓN OCULTO AL INICIO! opacity: 0 y pointer-events: none -->
                    <button id="btn-next-door" class="continue-button" style="background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); opacity: 0; pointer-events: none; transition: opacity 2s ease;" type="button">
                        <span class="continue-label">Siguiente capítulo</span>
                        <span class="continue-arrow" aria-hidden="true">→</span>
                    </button>
                </footer>
            </div>
        </section>

    </main>

    <!-- LÓGICA JAVASCRIPT ACTUALIZADA CON EDGE BLEND Y NUEVOS LAYOUTS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const respuestasValidas = ["cabra", "cabras", "las cabras", "una cabra"];
            
            // =====================================================
            // EL GUIÓN DE LA PELÍCULA (SOLO CORTES HORIZONTALES)
            // =====================================================
            const secuenciaMemoria = [
                {
                    type: "grid", layout: "layout-3", // 1 arriba (ancha), 2 abajo (mitad y mitad)
                    media: ["assets/photos/creta_foto_1.jpg", "assets/photos/creta_foto_2.jpg", "assets/photos/creta_foto_3.jpg"],
                    text: "Nuestro primer gran viaje del año. Llegamos a la isla sin saber la aventura que nos esperaba...",
                    duration: 5000
                },
                {
                    type: "video",
                    media: "assets/photos/creta_video_1.mp4",
                    text: "Aguas tan transparentes que parecían de mentira.",
                    duration: 6500
                },
                {
                    type: "grid", layout: "layout-3-alt1", // 2 arriba (mitad y mitad), 1 abajo (ancha)
                    media: ["assets/photos/creta_foto_4.jpg", "assets/photos/creta_foto_5.jpg", "assets/photos/creta_foto_6.jpg"],
                    text: "Entre ruinas milenarias, carreteras imposibles y muchísima comida griega.",
                    duration: 5000
                },
                {
                    type: "video",
                    media: "assets/photos/creta_video_2.mp4",
                    text: "Momentos de paz y risas que se quedan para siempre.",
                    duration: 6500
                },
                {
                    type: "grid", layout: "layout-3", // Repetimos el layout-3
                    media: ["assets/photos/creta_foto_7.jpg", "assets/photos/creta_foto_8.jpg", "assets/photos/creta_foto_9.jpg"],
                    text: "Y sí, vigilados constantemente por nuestras queridas amigas las cabras.",
                    duration: 5000
                },
                {
                    type: "video",
                    media: "assets/photos/creta_video_3.mp4",
                    text: "Desconectamos del mundo para conectar aún más entre nosotros.",
                    duration: 6500
                },
                {
                    type: "grid", layout: "layout-2", // 1 grande arriba, 1 grande abajo
                    media: ["assets/photos/creta_foto_10.jpg", "assets/photos/creta_foto_11.jpg"],
                    text: "Porque cualquier lugar es mágico si lo descubro de tu mano. A por el siguiente destino.",
                    duration: 6000
                }
            ];

            const btnUnlock = document.getElementById("btn-unlock");
            const inputRiddle = document.getElementById("riddle-input");
            const errorText = document.getElementById("error-message");
            const lockScreen = document.getElementById("lock-screen");
            const riddleContent = document.getElementById("riddle-content");
            const riddleFooter = document.getElementById("riddle-footer");
            const successMessage = document.getElementById("success-message");
            const unlockedScreen = document.getElementById("unlocked-screen");
            const bgMedia = document.getElementById("bg-media");
            const bgImage = document.getElementById("bg-image");
            const bgDarkness = document.getElementById("bg-darkness");
            
            const layer1 = document.getElementById("media-layer-1");
            const layer2 = document.getElementById("media-layer-2");
            const storyText = document.getElementById("dynamic-story-text");
            const btnNextDoor = document.getElementById("btn-next-door");
            
            let activeLayer = layer1;
            let hiddenLayer = layer2;
            let currentSequenceIndex = 0;
            let movieTimeout;

            function normalizarTexto(texto) {
                return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            }

            // AHORA ENVOLVEMOS CADA FOTO Y VÍDEO CON LA CAPA EDGE-BLEND
            function construirLayout(step) {
                if (step.type === "grid") {
                    return `
                        <div class="layout-grid ${step.layout}">
                            ${step.media.map((src, i) => `
                                <div class="media-wrapper item-${i}">
                                    <img class="media-fit" src="${src}" alt="">
                                    <div class="edge-blend"></div>
                                </div>
                            `).join('')}
                        </div>`;
                } else if (step.type === "video") {
                    return `
                        <div class="media-wrapper">
                            <video class="media-fit" src="${step.media}" autoplay muted loop playsinline></video>
                            <div class="edge-blend"></div>
                        </div>
                    `;
                }
            }

            function reproducirSecuencia() {
                const step = secuenciaMemoria[currentSequenceIndex];

                if (currentSequenceIndex === secuenciaMemoria.length - 1) {
                    btnNextDoor.style.opacity = 1;
                    btnNextDoor.style.pointerEvents = "auto";
                }

                hiddenLayer.innerHTML = construirLayout(step);

                storyText.style.opacity = 0;
                setTimeout(() => {
                    storyText.innerText = step.text;
                    storyText.style.opacity = 1;
                }, 800);

                hiddenLayer.classList.remove("layer-hidden");
                hiddenLayer.classList.add("layer-active");
                activeLayer.classList.remove("layer-active");
                activeLayer.classList.add("layer-hidden");

                const temp = activeLayer;
                activeLayer = hiddenLayer;
                hiddenLayer = temp;

                currentSequenceIndex++;
                if (currentSequenceIndex >= secuenciaMemoria.length) {
                    currentSequenceIndex = 0; 
                }

                movieTimeout = setTimeout(reproducirSecuencia, step.duration);
            }

            function verificarRespuesta() {
                const esCorrecta = respuestasValidas.some(val => val === normalizarTexto(inputRiddle.value));

                if (esCorrecta) {
                    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                    errorText.classList.remove("show");

                    riddleContent.classList.add("fade-out-fast");
                    riddleFooter.classList.add("fade-out-fast");

                    bgImage.style.opacity = 0; 
                    setTimeout(() => { bgImage.src = "assets/photos/creta_cabra.jpg"; bgImage.style.opacity = 1; }, 400);

                    bgMedia.classList.remove("blur-background");
                    bgMedia.classList.add("unblurred");
                    bgDarkness.classList.remove("opacity-heavy");
                    bgDarkness.classList.add("opacity-none");

                    setTimeout(() => {
                        riddleContent.classList.add("hidden");
                        riddleFooter.classList.add("hidden");
                        successMessage.classList.remove("hidden");
                        successMessage.classList.add("animate-fade-in-up");
                    }, 800);

                    setTimeout(() => {
                        successMessage.classList.add("fade-out-fast");
                        bgImage.style.opacity = 0; 
                        
                        setTimeout(() => {
                            lockScreen.classList.add("hidden");
                            unlockedScreen.classList.remove("hidden");
                            reproducirSecuencia();
                        }, 800);
                    }, 4500);

                } else {
                    if (navigator.vibrate) navigator.vibrate(200);
                    errorText.classList.add("show");
                    inputRiddle.classList.remove("shake");
                    void inputRiddle.offsetWidth; 
                    inputRiddle.classList.add("shake");
                }
            }

            if(btnUnlock) btnUnlock.addEventListener("click", verificarRespuesta);
            if(inputRiddle) {
                inputRiddle.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") { e.preventDefault(); inputRiddle.blur(); verificarRespuesta(); }
                });
            }

            if(btnNextDoor) {
                btnNextDoor.addEventListener("click", () => {
                    if (navigator.vibrate) navigator.vibrate(50);
                    document.getElementById("app-puerta1").classList.add("fade-out");
                    setTimeout(() => window.location.href = "puerta2.html", 1200);
                });
            }
        });
    </script>
</body>
</html>
